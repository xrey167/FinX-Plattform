[package]
name = "tdw-outbox"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real Postgres-backed outbox built on top of
# tdw-storage-postgres::PgEngine. Off by default so the workspace
# test set stays offline.
postgres = ["dep:async-trait", "dep:tdw-core", "dep:tdw-storage-postgres", "dep:tokio", "tdw-storage-postgres/postgres"]

[dependencies]
async-trait = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true, optional = true }
tdw-event = { path = "../tdw-event" }
tdw-storage-postgres = { path = "../tdw-storage-postgres", optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
