[package]
name = "tdw-outbox"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
# Enables the real Postgres-backed outbox built on top of
# tdw-storage-postgres::PgEngine. Off by default so the workspace
# test set stays offline.
postgres = ["dep:async-trait", "dep:tdw-core", "dep:tdw-storage-postgres", "dep:tokio", "tdw-storage-postgres/postgres"]

[dependencies]
async-trait = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true, optional = true }
tdw-event = { path = "../tdw-event" }
tdw-storage-postgres = { path = "../tdw-storage-postgres", optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
