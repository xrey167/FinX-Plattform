[package]
name = "tdw-storage-broker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
# Enables the real Kafka producer backend (rskafka). Off by default so the
# workspace test set stays offline and pulls NO Kafka dependency; the
# always-available InMemoryBrokerSink covers offline recording tests. Mirrors
# how tdw-storage-clickhouse gates its `clickhouse` feature and tdw-provider-ws
# gates `ws`.
#
# rskafka is a pure-Rust Kafka client (no librdkafka / C / CMake), so it builds
# on a Windows host with no native build toolchain. We use default-features =
# false to drop the compression backends (lz4/zstd/snap pull in C *-sys crates)
# and enable only rustls transport.
ingest-broker = ["dep:rskafka", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
rskafka = { workspace = true, optional = true }
serde_json = { workspace = true }
tdw-core = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
schemars = { workspace = true }
serde = { workspace = true }

# Unique target name so this `examples/basic.rs` does not collide with the other
# storage crates' `basic` example in the shared workspace target directory.
[[example]]
name = "tdw-storage-broker-basic"
path = "examples/basic.rs"

[lints]
workspace = true
