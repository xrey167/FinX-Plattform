[package]
name = "tdw-service"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
## Forward to BOTH `tdw-app-server` and the factored bootstrap in `tdw-backend`
## so `tdw_backend::server::spawn_transport` actually compiles in the optional
## transport (the bootstrap logic now lives in `tdw-backend`, not here).
transport-http = ["tdw-app-server/transport-http", "tdw-backend/transport-http"]
transport-uds = ["tdw-app-server/transport-uds", "tdw-backend/transport-uds"]
## Postgres-back the daemon's session/rollout stores (forwards to
## `tdw-service-api/daemon-postgres`). Selected at runtime via `TDW_DAEMON_PG_URL`
## / `DATABASE_URL`; built into the `live` compose daemon image.
daemon-postgres = ["tdw-service-api/daemon-postgres"]
## Enable the real wasmi UDF runtime in the daemon (forwards to
## `tdw-service-api/udf-wasm` → `tdw-sandbox/udf-wasm`). With this feature a
## `udf.run` ToolCall carrying base64 WASM in `source` routes to the wasmi
## runtime under per-request `WasmLimits`; without it the deterministic fixture
## runtime is used. Built into the `live` compose daemon image.
udf-wasm = ["tdw-service-api/udf-wasm"]
## Compile the Bolt/Memgraph graph-database backend into the daemon (forwards to
## `tdw-backend/bolt`). Required for `knowledge.graph.backend = "bolt"` at
## runtime; without it the daemon hard-errors at startup when TDW_CONFIG_CONTENT
## pins `backend = "bolt"`. Built into the `live` compose daemon image via the
## `real-engines` group below.
bolt = ["tdw-backend/bolt"]
## Full production feature set for the `live` compose daemon image. Forwards the
## real-engines group to `tdw-service-api` (Postgres/ClickHouse/Qdrant/Meilisearch
## /S3 + daemon-postgres), enables Bolt graph support (`tdw-backend/bolt`), and
## Postgres-backs the daemon session/rollout stores. This is what the
## `docker/tdw-service.Dockerfile` `FEATURES: real-engines,udf-wasm` arg
## activates.
real-engines = ["tdw-service-api/real-engines", "bolt"]

[dependencies]
serde_json = { workspace = true }
# The daemon bootstrap (config/transport/serve) is factored into `tdw-backend`'s
# `server` module; this leaf binary calls back into it. No cycle: nothing depends
# on `tdw-service`.
tdw-backend = { path = "../tdw-backend" }
tdw-app-server = { workspace = true }
tdw-config = { workspace = true }
tdw-service-api = { path = "../tdw-service-api" }
tdw-test-utils = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }
tdw-protocol = { workspace = true }

[dev-dependencies]
tdw-auth-oidc = { path = "../tdw-auth-oidc" }
tdw-app-server = { workspace = true }
tdw-service-api = { path = "../tdw-service-api", features = ["real-postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[[example]]
name = "tdw_service_basic"
path = "examples/basic.rs"

[lints]
workspace = true
