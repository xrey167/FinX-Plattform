[package]
name = "tdw-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Phase 0 path dependencies — only crates actually referenced this phase. Later
# phases add more (tdw-app-server, tdw-app-client, tdw-kg, tdw-tags,
# tdw-feature-store, tdw-knowledge, tdw-workflow-engine, tdw-eval-runner,
# tdw-protocol, tdw-auth, tdw-hooks, tdw-event) as their surfaces are wired in.
tdw-service-api = { path = "../tdw-service-api" }
tdw-runtime = { path = "../tdw-runtime" }
tdw-config = { path = "../tdw-config" }
tdw-agent = { path = "../tdw-agent" }
tdw-tool-exec = { path = "../tdw-tool-exec" }
tdw-mcp = { path = "../tdw-mcp" }
tdw-agent-store = { path = "../tdw-agent-store" }
# Phase 1 — the async data facade surfaces these crates' types directly.
tdw-core = { path = "../tdw-core" }
tdw-domain = { path = "../tdw-domain" }
tdw-protocol = { path = "../tdw-protocol" }
tdw-app-server = { path = "../tdw-app-server" }
# Phase 5 — the loopback daemon client the embedded MCP surface uses to reach
# the in-process daemon over TCP/UDS/HTTP at its bound address.
tdw-app-client = { path = "../tdw-app-client" }
# Phase 2 — the sync agent/MCP facade compiles workflows and runs evals.
tdw-workflow-engine = { path = "../tdw-workflow-engine" }
tdw-eval-runner = { path = "../tdw-eval-runner" }
# Phase 3 — the knowledge group: sync KG/tags/features + the async knowledge index.
tdw-kg = { path = "../tdw-kg" }
tdw-tags = { path = "../tdw-tags" }
tdw-feature-store = { path = "../tdw-feature-store" }
tdw-knowledge = { path = "../tdw-knowledge" }
# Phase 4 — the auth/hooks/policy/events group. `tdw-bus`/`tdw-outbox` are named
# only to type the event-spine accessors (`AppState.bus` / `AppState.outbox`),
# which `tdw-service-api` does not re-export.
tdw-auth = { path = "../tdw-auth" }
tdw-hooks = { path = "../tdw-hooks" }
tdw-event = { path = "../tdw-event" }
tdw-bus = { path = "../tdw-bus" }
tdw-outbox = { path = "../tdw-outbox" }

thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }

[features]
default = []
## Forward the daemon transport features to `tdw-app-server`/`server::spawn_transport`
## so a `tdw-backend` build (lib or binary) can serve UDS/HTTP, exactly as the
## `tdw-service` binary's features did. `transport-tcp` is always on via the
## `tdw-app-server` default; these add the optional transports.
transport-http = ["tdw-app-server/transport-http"]
transport-uds = ["tdw-app-server/transport-uds"]

[[bin]]
name = "tdw-backend"
path = "src/bin/tdw-backend.rs"

[dev-dependencies]
tokio = { workspace = true }
# Reused as the offline, deterministic test fetcher for fetch/stream coverage.
tdw-provider-fileset = { path = "../tdw-provider-fileset" }

[lints]
workspace = true
