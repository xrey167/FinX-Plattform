[package]
name = "tdw-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Phase 0 path dependencies — only crates actually referenced this phase. Later
# phases add more (tdw-app-server, tdw-app-client, tdw-kg, tdw-tags,
# tdw-feature-store, tdw-knowledge, tdw-workflow-engine, tdw-eval-runner,
# tdw-protocol, tdw-auth, tdw-hooks, tdw-event) as their surfaces are wired in.
tdw-service-api = { path = "../tdw-service-api" }
tdw-runtime = { path = "../tdw-runtime" }
tdw-config = { path = "../tdw-config" }
tdw-agent = { path = "../tdw-agent" }
tdw-tool-exec = { path = "../tdw-tool-exec" }
tdw-mcp = { path = "../tdw-mcp" }
tdw-agent-store = { path = "../tdw-agent-store" }
# Phase 1 — the async data facade surfaces these crates' types directly.
tdw-core = { path = "../tdw-core" }
tdw-domain = { path = "../tdw-domain" }
tdw-protocol = { path = "../tdw-protocol" }
tdw-app-server = { path = "../tdw-app-server" }
# Phase 5 — the loopback daemon client the embedded MCP surface uses to reach
# the in-process daemon over TCP/UDS/HTTP at its bound address.
tdw-app-client = { path = "../tdw-app-client" }
# Phase 2 — the sync agent/MCP facade compiles workflows and runs evals.
tdw-workflow-engine = { path = "../tdw-workflow-engine" }
tdw-eval-runner = { path = "../tdw-eval-runner" }
# K-L3 — cron scheduling for the in-daemon self-eval worker.
tdw-cron = { path = "../tdw-cron" }
# Phase C1 — the eval runner now executes cases through a `LanguageModel`; the
# backend injects the deterministic offline `StubLanguageModel` by default so
# `run_eval` never hits the network.
tdw-llm = { path = "../tdw-llm" }
# Phase 3 — the knowledge group: sync KG/tags/features + the async knowledge index.
tdw-kg = { path = "../tdw-kg" }
tdw-tags = { path = "../tdw-tags" }
tdw-feature-store = { path = "../tdw-feature-store" }
tdw-knowledge = { path = "../tdw-knowledge" }
# F1 — graph storage (InMemory always; Bolt behind the `bolt` feature).
# tdw-retrieve wires the hybrid Retriever into KnowledgeRuntime.
# tdw-infer and tdw-tag-rules expose version stamps to KnowledgeVersions.
tdw-storage-graph = { path = "../tdw-storage-graph" }
tdw-retrieve = { path = "../tdw-retrieve" }
tdw-infer = { path = "../tdw-infer" }
tdw-tag-rules = { path = "../tdw-tag-rules" }
# Phase A1 — the hash embedder injected into the shared knowledge index so it
# rides on `AppState.vector` (durable when that is a real Qdrant engine).
tdw-embed = { path = "../tdw-embed" }
tdw-embed-local = { path = "../tdw-embed-local" }
# Phase A2 — the real OpenAI HTTP embedder, only when the `openai` feature is on
# (it forwards the dependency's `http` feature, which pulls reqwest). Off by
# default so the default backend build stays fully offline.
tdw-embed-openai = { path = "../tdw-embed-openai", optional = true }
# Phase A2 — the real Google/Gemini HTTP embedder, only when the `google` feature
# is on (forwards the dependency's `http` feature). Off by default.
tdw-embed-google = { path = "../tdw-embed-google", optional = true }
# Phase 4 — the auth/hooks/policy/events group. `tdw-bus`/`tdw-outbox` are named
# only to type the event-spine accessors (`AppState.bus` / `AppState.outbox`),
# which `tdw-service-api` does not re-export.
tdw-auth = { path = "../tdw-auth" }
tdw-hooks = { path = "../tdw-hooks" }
tdw-event = { path = "../tdw-event" }
tdw-bus = { path = "../tdw-bus" }
tdw-outbox = { path = "../tdw-outbox" }

thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }
# Phase B — the live consolidation scheduler's wall clock for `consolidate_now`.
chrono = { workspace = true }

[features]
default = []
## Compile the real OpenAI HTTP embedder selector arm. Forwards the
## `tdw-embed-openai/http` feature (reqwest). Off by default so the default
## backend build pulls no HTTP embedder and `select_embedder` always returns the
## deterministic hash embedder.
openai = ["dep:tdw-embed-openai", "tdw-embed-openai/http"]
## Compile the real Google/Gemini HTTP embedder selector arm. Forwards
## `tdw-embed-google/http` (reqwest). Off by default.
google = ["dep:tdw-embed-google", "tdw-embed-google/http"]
## Compile the on-disk local-model embedder selector arm (`provider = local`).
## Forwards `tdw-embed-local/model` (the pure-Rust candle BERT stack). Off by
## default so the standard build stays dependency-light (knowledge-system B6).
local-model = ["tdw-embed-local/model"]
## Compile the Bolt/Memgraph graph-database backend. Enables the `bolt` arm of
## `knowledge.graph.backend` selection at daemon startup. Off by default so the
## standard build pulls no neo4rs/tokio-network graph dependency; the daemon
## binary and production Dockerfiles turn it on.
bolt = ["tdw-storage-graph/bolt"]
## Forward the daemon transport features to `tdw-app-server`/`server::spawn_transport`
## so a `tdw-backend` build (lib or binary) can serve UDS/HTTP, exactly as the
## `tdw-service` binary's features did. `transport-tcp` is always on via the
## `tdw-app-server` default; these add the optional transports.
transport-http = ["tdw-app-server/transport-http"]
transport-uds = ["tdw-app-server/transport-uds"]
## Serve the catalog-derived REST surface (`GET /api/v1/{route...}`,
## `GET /openapi.json`) on an env-gated listener (`TDW_DAEMON_REST_BIND`).
## Forwards `tdw-service-api/rest-api-route` (which implies `transport-http`).
rest-api-route = ["tdw-service-api/rest-api-route", "tdw-app-server/rest-api-route"]
## Serve the OpenBB Workspace bridge surface (`GET /widgets.json`,
## `GET /apps.json`, `GET /widget-data/{route...}`) on an env-gated listener
## (`TDW_WORKSPACE_BIND`). Forwards `tdw-app-server/workspace-route` (which
## implies `rest-api-route` + `transport-http`) and reuses the same
## `RestApiState` fetch seam as the REST surface.
workspace-route = [
    "tdw-service-api/rest-api-route",
    "tdw-app-server/workspace-route",
]
## Serve the OpenBB Workspace *agent protocol* bridge (`GET /agents.json`,
## `POST /v1/query` SSE copilot) on an env-gated listener (`TDW_AGENT_BIND`).
## Forwards `tdw-service-api/agent-route` (which provides `AgentBridgeState` and
## implies `workspace-route`) and `tdw-app-server/agent-route`. Reuses the same
## CORS + optional `X-TDW-API-KEY` auth as the workspace bridge.
agent-route = [
    "tdw-service-api/agent-route",
    "tdw-app-server/agent-route",
]

[[bin]]
name = "tdw-backend"
path = "src/bin/tdw-backend.rs"

[[example]]
name = "tdw_backend_basic"
path = "examples/basic.rs"

[[example]]
name = "trading_consumer"
path = "examples/trading_consumer.rs"

[[example]]
name = "learning_consumer"
path = "examples/learning_consumer.rs"

[dev-dependencies]
tokio = { workspace = true }
# Reused as the offline, deterministic test fetcher for fetch/stream coverage.
tdw-provider-fileset = { path = "../tdw-provider-fileset" }
# K-L3 integration tests: eval-runner types for the wiring proof tests.
tdw-eval-runner = { path = "../tdw-eval-runner" }
# K-L4 tests submit proposals with Adaptivity values from the taxonomy crate.
# `tdw-taxonomy` is a dep of `tdw-knowledge` but not of `tdw-backend`; the
# dev-dep makes the type available to integration tests without widening the
# production dependency surface.
tdw-taxonomy = { path = "../tdw-taxonomy" }
# K-L4 spawned-task test: CancellationToken for driving the real sweep task.
tdw-app-server = { path = "../tdw-app-server" }
# K-L4 inference test: wire a real InferEngine to assert derived edges after sweep.
tdw-infer = { path = "../tdw-infer" }

[lints]
workspace = true
