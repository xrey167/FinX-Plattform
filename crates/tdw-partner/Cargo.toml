[package]
name = "tdw-partner"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tdw-core = { workspace = true }
tdw-domain = { workspace = true }
tdw-endpoint-catalog = { workspace = true }
# tdw-infer is a LIGHT leaf (core/tags/taxonomy/storage-graph — no cycle): the
# W4.3 routing-hint reader reads the installed (promoted-past-B9) rule set off
# an InferEngine. Partner Core only READS it; the engine is driven by the gated
# daemon worker, never mutated here.
tdw-infer = { path = "../tdw-infer" }
tdw-knowledge = { workspace = true }
tdw-llm = { workspace = true }
tdw-openbb-agent = { workspace = true }
tdw-tags = { path = "../tdw-tags" }
tdw-taxonomy = { workspace = true }
# tdw-eval-runner backs the W4.4 walk-forward usefulness harness
# (walk_forward::walk_forward_usefulness), exposed as a PUBLIC non-test eval
# entry point ONLY under the `eval-harness` feature. The default (leaf) build
# never pulls it in — the gated daemon's eval loop / a benchmark gate turns the
# feature on. Keeping it optional preserves tdw-partner's leaf posture.
tdw-eval-runner = { path = "../tdw-eval-runner", optional = true }

[features]
# Compiles the public walk-forward usefulness eval entry point (W4.4). Off by
# default so the heavy offline-replay dependency stays out of the leaf build.
eval-harness = ["dep:tdw-eval-runner"]

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tdw-embed-local = { path = "../tdw-embed-local" }
tdw-eval-runner = { path = "../tdw-eval-runner" }
# tdw-induction / tdw-patterns are DEV-only: the W4.3 gate test and the W4.4
# walk-forward usefulness harness drive the real induction → promote-gate →
# hot_reload path offline. Production code reads only the installed rule set.
tdw-induction = { workspace = true }
tdw-patterns = { workspace = true }
tdw-storage-graph = { path = "../tdw-storage-graph" }
tdw-storage-qdrant = { path = "../tdw-storage-qdrant" }
# tdw-workflow-engine / tdw-agent are DEV-only: the W6.2 zero-to-partner first
# run is authored as a workflow DAG and compiled by the engine in a test, proving
# the <10-min onboarding walkthrough sequences offline/deterministically. Both
# are light leaves (tdw-agent → tdw-taxonomy only), so no cycle.
tdw-agent = { path = "../tdw-agent" }
tdw-workflow-engine = { path = "../tdw-workflow-engine" }
# tdw-cron / tdw-protocol are DEV-only here: the production schedule trigger is
# assembled in tdw-backend (which legally depends on tdw-cron), because a normal
# dep on tdw-cron would form a cycle (tdw-cron → tdw-worker → tdw-service-api →
# tdw-partner). This crate stays a pure leaf; the pinned-clock scheduled-fire
# test reuses the real tdw-cron spine to prove the design's "no new scheduler".
tdw-cron = { path = "../tdw-cron" }
tdw-protocol = { workspace = true }

[lints]
workspace = true
