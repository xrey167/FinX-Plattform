[package]
name = "tdw-storage-qdrant"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real Qdrant HTTP backend (reqwest). Off by default so
# the workspace test set stays offline; the integration test is
# additionally gated by the env var TDW_QDRANT_TEST_URL.
qdrant = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }

# Unique target name so this `examples/basic.rs` does not collide with the other
# storage crates' `basic` example in the shared workspace target directory.
[[example]]
name = "tdw-storage-qdrant-basic"
path = "examples/basic.rs"

[lints]
workspace = true
