[package]
name = "tdw-provider-coingecko"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
# Enables the real CoinGecko HTTP fetcher (reqwest). Off by default so
# workspace tests stay offline; live calls are additionally gated by
# TDW_COINGECKO_LIVE=1. CoinGecko's free tier requires no API key, but
# an optional COINGECKO_API_KEY is forwarded when present.
http = [
    "dep:bytes",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tdw-core",
    "dep:tdw-domain",
    "dep:tokio", "tdw-core/http",
    "dep:tdw-provider-http",
    "tdw-provider-http/http"]

[dependencies]
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true, optional = true }
tdw-domain = { workspace = true, optional = true }
tdw-provider-http = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[[example]]
name = "basic"
required-features = ["http"]

[lints]
workspace = true
