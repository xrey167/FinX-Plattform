[package]
name = "tdw-embed"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# Unique example binary name (the workspace builds examples into one shared
# target dir, where a bare `basic` would collide across crates).
[[example]]
name = "tdw_embed_basic"
path = "examples/basic.rs"

[lints]
workspace = true
