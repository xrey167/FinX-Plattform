[package]
name = "tdw-storage-clickhouse"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real ClickHouse HTTP backend (reqwest). Off by default
# so the workspace test set stays offline; the integration test is
# additionally gated by the env var TDW_CLICKHOUSE_TEST_URL.
clickhouse = ["dep:reqwest", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true }
tdw-core = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
schemars = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
