[package]
name = "tdw-storage-clickhouse"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
# Enables the real ClickHouse HTTP backend (reqwest). Off by default
# so the workspace test set stays offline; the integration test is
# additionally gated by the env var TDW_CLICKHOUSE_TEST_URL.
clickhouse = ["dep:reqwest", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true }
tdw-core = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
schemars = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
