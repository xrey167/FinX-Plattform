[package]
name = "tdw-knowledge"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true }
tdw-embed = { path = "../tdw-embed" }
tdw-embed-local = { path = "../tdw-embed-local" }
tdw-kg = { path = "../tdw-kg" }
tdw-news-compose = { path = "../tdw-news-compose" }
tdw-retrieve = { path = "../tdw-retrieve" }
tdw-storage-qdrant = { path = "../tdw-storage-qdrant" }
tdw-tag-rules = { path = "../tdw-tag-rules" }
tdw-tags = { path = "../tdw-tags" }
tdw-taxonomy = { workspace = true }
thiserror = { workspace = true }
# B9 writeback gate: the runtime holds the proposal queue behind a
# `tokio::sync::Mutex` so the async MCP write tools (submit/materialize) can lock
# it across awaits; only the `sync` feature is needed (no runtime here).
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tdw-storage-graph = { path = "../tdw-storage-graph" }
tdw-storage-meilisearch = { path = "../tdw-storage-meilisearch" }
tokio = { workspace = true }

# Unique example binary name (the workspace builds examples into one shared
# target dir, where a bare `basic` would collide across crates).
[[example]]
name = "tdw_knowledge_basic"
path = "examples/basic.rs"

[lints]
workspace = true
