[package]
name = "tdw-provider-oecd"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
http = ["dep:bytes","dep:reqwest","dep:tdw-core","dep:tdw-domain","dep:tokio", "tdw-core/http","dep:tdw-provider-http","tdw-provider-http/http"]

[dependencies]
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true, optional = true }
tdw-domain = { workspace = true, optional = true }
tdw-provider-http = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tdw-provider-testkit = { path = "../tdw-provider-testkit" }

[[test]]
name = "http_fetcher"
path = "tests/http_fetcher.rs"
required-features = ["http"]

[lints]
workspace = true
