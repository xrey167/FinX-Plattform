[package]
name = "tdw-provider-bls"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real BLS HTTP fetcher (reqwest). Off by default so
# workspace tests stay offline; live calls are additionally gated by
# TDW_BLS_LIVE=1 and TDW_BLS_API_KEY.
http = [
    "dep:async-trait",
    "dep:bytes",
    "dep:reqwest",
    "dep:tdw-core",
    "dep:tdw-domain",
    "dep:tokio",
]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true, optional = true }
tdw-domain = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tdw-provider-testkit = { path = "../tdw-provider-testkit" }

[lints]
workspace = true
