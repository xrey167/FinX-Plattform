[package]
name = "tdw-llm-openai-compat"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[features]
default = []
# Enables the real OpenAI-compatible Chat Completions HTTP backend.
# Off by default so the workspace test set stays offline; the live
# test is additionally gated by TDW_OPENAI_COMPAT_LIVE=1 and either
# OPENAI_API_KEY or TDW_OPENAI_COMPAT_API_KEY.
http = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio"]

[dependencies]
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tdw-llm = { workspace = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
