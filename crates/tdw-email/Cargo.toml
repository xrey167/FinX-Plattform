[package]
name = "tdw-email"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real SMTP transport (lettre + tokio). Off by default so the
# workspace test set stays offline; live sends are additionally gated by
# the presence of TDW_SMTP_HOST in the environment.
smtp = ["dep:lettre", "dep:tokio"]
# Enables the BroadcastClient backed by reqwest. Off by default so the
# workspace test set stays offline; live calls are additionally gated by
# the presence of TDW_BROADCAST_API_KEY in the environment.
broadcast = ["dep:reqwest", "dep:serde_json", "dep:tokio"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
lettre = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
