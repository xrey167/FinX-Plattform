<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We Miss You</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; font-family: Arial, sans-serif; color: #333; }
    .wrapper { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 4px; overflow: hidden; }
    .header { background: #2d2d2d; padding: 24px 32px; }
    .header h1 { margin: 0; font-size: 22px; color: #fff; }
    .body { padding: 32px; line-height: 1.6; }
    .cta-btn { display: inline-block; margin-top: 16px; padding: 12px 24px; background: #2d7dd2; color: #fff; text-decoration: none; border-radius: 4px; font-size: 15px; }
    .footer { background: #f0f0f0; padding: 16px 32px; font-size: 12px; color: #888; text-align: center; }
    .footer a { color: #555; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>We Miss You</h1>
    </div>
    <div class="body">
      <p>Hello {{name}},</p>
      <p>{{body}}</p>
      <a class="cta-btn" href="{{cta_url}}">{{cta_label}}</a>
    </div>
    <div class="footer">
      <p>You are receiving this message because you have an account with us.</p>
      <p><a href="{{unsubscribe_url}}">Unsubscribe</a></p>
    </div>
  </div>
</body>
</html>
