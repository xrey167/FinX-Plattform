[package]
name = "tdw-worker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
postgres = ["sqlx/postgres"]

[dependencies]
async-trait = { workspace = true }
# `alloc` enables `futures_util::stream::FuturesUnordered`, used by the serve
# loop to drive up to `max_concurrent` in-flight jobs without spawning tasks.
futures-util = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tdw-app-client = { workspace = true }
tdw-app-server = { workspace = true }
tdw-protocol = { workspace = true }
tdw-service-api = { path = "../tdw-service-api" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[[example]]
name = "tdw_worker_basic"
path = "examples/basic.rs"

[lints]
workspace = true
