[package]
name = "tdw-service-api"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
## Select `LocalFsBlobEngine` (from `tdw-storage-fs`) as the blob backend in
## `AppState::from_config` when `config.profile == "service"`. Without this
## feature the default `InMemoryS3BlobEngine` is used unconditionally.
storage-fs = ["dep:tdw-storage-fs"]

## Enable the WASM fixture UDF runtime in `tdw-sandbox`. Forwarded to the
## sandbox crate so the feature tree is consistent.
udf-wasm = ["tdw-sandbox/udf-wasm"]

## Implement `tdw_app_server::RestApiHandler` for `AppState` so the daemon's
## catalog-derived REST surface (`GET /api/v1/{route...}`, `GET /openapi.json`)
## can dispatch through the same policy-guarded `Op::FetchData` path. Forwards
## `tdw-app-server/rest-api-route` (which implies `transport-http`).
rest-api-route = ["tdw-app-server/rest-api-route"]

## Serve the OpenBB Workspace bridge surface (`GET /widgets.json`,
## `GET /apps.json`, `GET /widget-data/{route...}`). The data endpoint reuses
## the same `RestApiState` fetch seam as `rest-api-route`, so this forwards both
## `tdw-app-server/workspace-route` and `rest-api-route`.
workspace-route = ["rest-api-route", "tdw-app-server/workspace-route"]

## Serve the OpenBB Workspace *agent protocol* bridge (`GET /agents.json`,
## `POST /v1/query` SSE copilot). Implements `tdw_app_server::AgentBridgeHandler`
## on a thin state wrapper that drives a `StreamingLanguageModel` (the offline
## `StubLanguageModel` by default) through the pure `tdw-openbb-agent` sequencer.
## Forwards `tdw-app-server/agent-route` (which implies `workspace-route`).
agent-route = ["workspace-route", "tdw-app-server/agent-route", "dep:tdw-openbb-agent", "dep:tdw-partner"]

## Swap the relational engine in `AppState` for the real `PgEngine`
## (backed by `sqlx::PgPool`). Activates `tdw-storage-postgres/postgres`.
## Used exclusively in integration tests gated by `TDW_POSTGRES_TEST_URL`.
real-postgres = ["tdw-storage-postgres/postgres"]

## Postgres-back the daemon's OWN session + rollout stores (`SessionBackend::Pg`
## / `RolloutBackend::Pg`), selected at runtime when `TDW_DAEMON_PG_URL` (or
## `DATABASE_URL`) is set. Builds on `real-postgres` for `PgEngine` and pulls in
## the Postgres stores from `tdw-session` / `tdw-rollout`. Used by the `live`
## compose stack so daemon state survives container restarts.
daemon-postgres = [
    "real-postgres",
    "tdw-session/postgres",
    "tdw-rollout/postgres",
]

## Swap the OLAP engine in `AppState` for the real `ClickHouseHttpEngine`
## (reqwest over the ClickHouse HTTP interface). Activates
## `tdw-storage-clickhouse/clickhouse`. When enabled, `from_config` reads
## `TDW_CLICKHOUSE_URL` (+ optional `TDW_CLICKHOUSE_USER` / `_PASSWORD`) to point
## the ingest/query path at a live ClickHouse; `with_real_clickhouse` does the
## same explicitly for integration tests gated by `TDW_CLICKHOUSE_TEST_URL`.
real-clickhouse = ["tdw-storage-clickhouse/clickhouse"]

## Swap the vector engine in `AppState` for the real `QdrantHttpEngine`
## (reqwest over the Qdrant HTTP interface). Activates
## `tdw-storage-qdrant/qdrant`. When enabled, `from_config` reads
## `TDW_QDRANT_URL` (+ optional `TDW_QDRANT_API_KEY`) to point the knowledge
## index at a live Qdrant so durable knowledge survives restarts;
## `with_real_qdrant` does the same explicitly for integration tests gated by
## `TDW_QDRANT_TEST_URL`.
real-qdrant = ["tdw-storage-qdrant/qdrant"]

## Swap the lexical engine in `AppState` for the real `MeilisearchHttpEngine`
## (reqwest over the Meilisearch REST API). Activates
## `tdw-storage-meilisearch/meilisearch`. When the `live` profile is selected,
## `from_config` reads `TDW_MEILI_URL` (+ optional `TDW_MEILI_API_KEY`) to point
## the lexical index at a live Meilisearch so search documents survive restarts.
real-meilisearch = ["tdw-storage-meilisearch/meilisearch"]

## Swap the blob engine in `AppState` for the real `S3Engine` (aws-sdk-s3).
## Activates `tdw-storage-s3/s3`. When the `live` profile is selected,
## `from_config` reads `TDW_S3_ENDPOINT` / `TDW_S3_BUCKET` / `TDW_S3_ACCESS_KEY`
## / `TDW_S3_SECRET_KEY` (+ optional `TDW_S3_REGION`) to point object storage at
## a live S3/MinIO bucket. Independent of the `storage-fs` local-disk path.
real-s3 = ["tdw-storage-s3/s3"]

## Aggregate: select the real production engines (Postgres relational,
## ClickHouse OLAP, Qdrant vector, Meilisearch lexical, S3 blob) **and** the
## Postgres-backed daemon session/rollout stores. This is the feature set the
## `live` compose stack builds with so that `TDW_PROFILE=live` (or
## `TDW_ENGINES=real`) wires every engine to its real backend, failing closed at
## startup when a required connection env var is missing. Default builds leave
## all of these off, keeping the offline in-memory engines.
real-engines = [
    "real-postgres",
    "real-clickhouse",
    "real-qdrant",
    "real-meilisearch",
    "real-s3",
    "daemon-postgres",
]

## Enable the live Binance trade websocket subscribe path in the streaming
## ingest control ops. Forwarded to `tdw-provider-binance/ws`. Without this
## feature the default offline (deterministic single-tick) streamer is used so
## the workspace test set stays offline.
ws = ["tdw-provider-binance/ws"]

## Per-provider features that wire a live HTTP fetcher into `default_registry()`.
## Each pulls its provider crate (optional dep) plus that crate's `http` feature.
## None are enabled by default, so the default build stays offline and
## `default_registry()` keeps registering exactly the 3 offline providers.
provider-adanos = ["dep:tdw-provider-adanos", "tdw-provider-adanos/http"]
provider-akshare = ["dep:tdw-provider-akshare", "tdw-provider-akshare/http"]
provider-alpaca = ["dep:tdw-provider-alpaca", "tdw-provider-alpaca/http"]
provider-alpha-vantage = [
    "dep:tdw-provider-alpha-vantage",
    "tdw-provider-alpha-vantage/http",
]
provider-benzinga = ["dep:tdw-provider-benzinga", "tdw-provider-benzinga/http"]
provider-biztoc = ["dep:tdw-provider-biztoc", "tdw-provider-biztoc/http"]
provider-bls = ["dep:tdw-provider-bls", "tdw-provider-bls/http"]
provider-cboe = ["dep:tdw-provider-cboe", "tdw-provider-cboe/http"]
provider-cftc = ["dep:tdw-provider-cftc", "tdw-provider-cftc/http"]
provider-congress-gov = [
    "dep:tdw-provider-congress-gov",
    "tdw-provider-congress-gov/http",
]
provider-ccdata = ["dep:tdw-provider-ccdata", "tdw-provider-ccdata/http"]
provider-coingecko = ["dep:tdw-provider-coingecko", "tdw-provider-coingecko/http"]
provider-databento = ["dep:tdw-provider-databento", "tdw-provider-databento/http"]
provider-deribit = ["dep:tdw-provider-deribit", "tdw-provider-deribit/http"]
provider-ecb = ["dep:tdw-provider-ecb", "tdw-provider-ecb/http"]
provider-eia = ["dep:tdw-provider-eia", "tdw-provider-eia/http"]
provider-federal-reserve = [
    "dep:tdw-provider-federal-reserve",
    "tdw-provider-federal-reserve/http",
]
provider-famafrench = [
    "dep:tdw-provider-famafrench",
    "tdw-provider-famafrench/http",
]
provider-finra = ["dep:tdw-provider-finra", "tdw-provider-finra/http"]
provider-finnhub = ["dep:tdw-provider-finnhub", "tdw-provider-finnhub/http"]
provider-fmp = ["dep:tdw-provider-fmp", "tdw-provider-fmp/http"]
provider-fred = ["dep:tdw-provider-fred", "tdw-provider-fred/http"]
provider-government-us = [
    "dep:tdw-provider-government-us",
    "tdw-provider-government-us/http",
]
provider-imf = ["dep:tdw-provider-imf", "tdw-provider-imf/http"]
## Intrinio keyed provider (openbb-parity total wave G002). Live calls require
## the PAID INTRINIO_API_KEY; the dispatch bindings ship and compile without it.
provider-intrinio = ["dep:tdw-provider-intrinio", "tdw-provider-intrinio/http"]
provider-econdb = ["dep:tdw-provider-econdb", "tdw-provider-econdb/http"]
provider-geckoterminal = [
    "dep:tdw-provider-geckoterminal",
    "tdw-provider-geckoterminal/http",
]
provider-glassnode = ["dep:tdw-provider-glassnode", "tdw-provider-glassnode/http"]
provider-huggingface = [
    "dep:tdw-provider-huggingface",
    "tdw-provider-huggingface/http",
]
provider-nasdaq = ["dep:tdw-provider-nasdaq", "tdw-provider-nasdaq/http"]
provider-oecd = ["dep:tdw-provider-oecd", "tdw-provider-oecd/http"]
provider-polygon = ["dep:tdw-provider-polygon", "tdw-provider-polygon/http"]
provider-sec = ["dep:tdw-provider-sec", "tdw-provider-sec/http"]
provider-seeking-alpha = [
    "dep:tdw-provider-seeking-alpha",
    "tdw-provider-seeking-alpha/http",
]
provider-tiingo = ["dep:tdw-provider-tiingo", "tdw-provider-tiingo/http"]
provider-tmx = ["dep:tdw-provider-tmx", "tdw-provider-tmx/http"]
provider-tradier = ["dep:tdw-provider-tradier", "tdw-provider-tradier/http"]
provider-trading-economics = [
    "dep:tdw-provider-trading-economics",
    "tdw-provider-trading-economics/http",
]
provider-velodata = ["dep:tdw-provider-velodata", "tdw-provider-velodata/http"]

## Yahoo is already a non-optional offline dependency. This feature swaps the
## canonical yahoo/equity_historical implementation to the real HTTP fetcher.
provider-yahoo-http = ["tdw-provider-yahoo/http"]

## Binance is already a non-optional dependency (its offline ws default and
## fixture path stay wired); this feature only turns on its `http` ticker-price
## fetcher and registers it.
provider-binance-http = ["tdw-provider-binance/http"]

## Enable the price-alert CRUD dispatcher arms (`CreateAlert`, `ListAlerts`,
## `DeleteAlert`, `SetAlertActive`). Requires a Postgres connection: when the
## `postgres` feature on `tdw-alerts` is absent the store falls back to the
## in-memory implementation (suitable for tests and offline builds). Enabling
## this feature also activates `real-postgres` so `PgAlertStore` can be built.
alerts = ["dep:tdw-alerts"]

## Like `alerts` but wires the real `PgAlertStore` instead of `InMemoryAlertStore`.
## Used by the `live` compose stack so alerts survive container restarts.
alerts-postgres = ["alerts", "tdw-alerts/postgres", "real-postgres"]

## Enable the user-registration dispatcher arm (`RegisterUser`) + the
## `user.created` event emission, behind the first-party `tdw-identity` store.
## When the `postgres` feature on `tdw-identity` is absent the store falls back
## to the in-memory implementation (suitable for tests and offline builds).
## Mirrors the `alerts` feature pattern.
identity = ["dep:tdw-identity"]

## Like `identity` but wires the real `PgUserStore` instead of
## `InMemoryUserStore`. Used by the `live` compose stack so users survive
## container restarts. Mirrors the `alerts-postgres` feature pattern.
identity-postgres = ["identity", "tdw-identity/postgres", "real-postgres"]

## Enable the dispatcher hook that enqueues subscribed application-function
## jobs (welcome mailer, etc.) when a `user.created` event is emitted.
## Requires `identity` (the event is only emitted when that feature is on).
## The `AppState::function_enqueuer` field defaults to `None`; callers must
## wire a concrete `FunctionEnqueuer` impl to activate the path.
##
## NOTE: No production `FunctionEnqueuer` impl ships in this crate.
## `tdw-worker/Cargo.toml:42` has an unconditional back-dep on
## `tdw-service-api`, so pulling `tdw-functions`/`tdw-worker` here would
## create a Cargo manifest-level cycle.  The production `RouterEnqueuer` is
## a follow-up in a cycle-free wiring crate.
functions = ["identity", "dep:tracing"]

## Aggregate: enable every live HTTP fetcher at once. Offline-default-preserving
## — with no features `default_registry()` still returns only the 3 offline
## providers; this adds live HTTP fetchers when explicitly enabled. Yahoo is the
## exception: `provider-yahoo-http` swaps the existing offline Yahoo fixture for
## the real HTTP implementation under the same provider/endpoint key.
all-http-providers = [
    "provider-adanos",
    "provider-akshare",
    "provider-alpaca",
    "provider-alpha-vantage",
    "provider-benzinga",
    "provider-biztoc",
    "provider-bls",
    "provider-cboe",
    "provider-cftc",
    "provider-congress-gov",
    "provider-ccdata",
    "provider-coingecko",
    "provider-databento",
    "provider-deribit",
    "provider-ecb",
    "provider-eia",
    "provider-famafrench",
    "provider-federal-reserve",
    "provider-finra",
    "provider-finnhub",
    "provider-fmp",
    "provider-fred",
    "provider-government-us",
    "provider-imf",
    "provider-intrinio",
    "provider-econdb",
    "provider-geckoterminal",
    "provider-glassnode",
    "provider-huggingface",
    "provider-nasdaq",
    "provider-oecd",
    "provider-polygon",
    "provider-sec",
    "provider-seeking-alpha",
    "provider-tiingo",
    "provider-tmx",
    "provider-tradier",
    "provider-trading-economics",
    "provider-velodata",
    "provider-binance-http",
    "provider-yahoo-http",
]

