[package]
name = "tdw-service-api"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[features]
## Select `LocalFsBlobEngine` (from `tdw-storage-fs`) as the blob backend in
## `AppState::from_config` when `config.profile == "service"`. Without this
## feature the default `InMemoryS3BlobEngine` is used unconditionally.
storage-fs = ["dep:tdw-storage-fs"]

## Enable the WASM fixture UDF runtime in `tdw-sandbox`. Forwarded to the
## sandbox crate so the feature tree is consistent.
udf-wasm = ["tdw-sandbox/udf-wasm"]

## Swap the relational engine in `AppState` for the real `PgEngine`
## (backed by `sqlx::PgPool`). Activates `tdw-storage-postgres/postgres`.
## Used exclusively in integration tests gated by `TDW_POSTGRES_TEST_URL`.
real-postgres = ["tdw-storage-postgres/postgres"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-acp = { workspace = true }
tdw-actor = { path = "../tdw-actor" }
tdw-agent = { path = "../tdw-agent" }
tdw-agent-store = { path = "../tdw-agent-store" }
tdw-app-client = { workspace = true }
tdw-app-server = { workspace = true }
tdw-auth = { path = "../tdw-auth" }
tdw-auth-oidc = { path = "../tdw-auth-oidc" }
tdw-bus = { path = "../tdw-bus" }
tdw-cdc = { path = "../tdw-cdc" }
tdw-config = { workspace = true }
tdw-core = { workspace = true }
tdw-define = { path = "../tdw-define" }
tdw-domain = { workspace = true }
tdw-embed = { path = "../tdw-embed" }
tdw-embed-local = { path = "../tdw-embed-local" }
tdw-event = { path = "../tdw-event" }
tdw-eval-runner = { path = "../tdw-eval-runner" }
tdw-entity-resolver = { path = "../tdw-entity-resolver" }
tdw-exec = { workspace = true }
tdw-feature-store = { path = "../tdw-feature-store" }
tdw-graph = { path = "../tdw-graph" }
tdw-hooks = { path = "../tdw-hooks" }
tdw-kg = { path = "../tdw-kg" }
tdw-knowledge = { workspace = true }
tdw-llm = { workspace = true }
tdw-llm-anthropic = { workspace = true }
tdw-llm-openai-compat = { workspace = true }
tdw-mask = { path = "../tdw-mask" }
tdw-outbox = { path = "../tdw-outbox" }
tdw-pipe = { path = "../tdw-pipe" }
tdw-provider-fileset = { path = "../tdw-provider-fileset" }
tdw-provider-ws-mock = { path = "../tdw-provider-ws-mock" }
tdw-provider-yahoo = { path = "../tdw-provider-yahoo" }
tdw-protocol = { workspace = true }
tdw-replay = { path = "../tdw-replay" }
tdw-rollout = { workspace = true }
tdw-session = { path = "../tdw-session" }
tdw-runtime = { workspace = true }
tdw-sandbox = { workspace = true }
tdw-snapshot = { path = "../tdw-snapshot" }
tdw-spatial = { path = "../tdw-spatial" }
tdw-stage = { path = "../tdw-stage" }
tdw-storage-clickhouse = { path = "../tdw-storage-clickhouse" }
tdw-storage-fs = { workspace = true, optional = true }
tdw-storage-meilisearch = { path = "../tdw-storage-meilisearch" }
tdw-storage-postgres = { path = "../tdw-storage-postgres" }
tdw-storage-qdrant = { path = "../tdw-storage-qdrant" }
tdw-storage-s3 = { path = "../tdw-storage-s3" }
tdw-table-format = { path = "../tdw-table-format" }
tdw-tag-rules = { path = "../tdw-tag-rules" }
tdw-tags = { path = "../tdw-tags" }
tdw-tools = { workspace = true }
