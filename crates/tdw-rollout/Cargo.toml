[package]
name = "tdw-rollout"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
## Postgres-backed `PgRollout` sink (in addition to the default `JsonlRollout`).
## Pulls in `tdw-core` for the `RelationalEngine` trait; the concrete engine
## (e.g. `PgEngine`) is supplied by the caller, so no driver dep lands here.
postgres = ["dep:tdw-core"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true, optional = true }
tdw-protocol = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
