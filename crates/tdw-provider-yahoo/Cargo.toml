[package]
name = "tdw-provider-yahoo"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[features]
default = []
# Enables the real Yahoo Finance HTTP fetcher (reqwest). Off by
# default so the workspace test set stays offline; the live test is
# additionally gated by the env var TDW_YAHOO_LIVE=1 so unattended
# CI runs do not hit Yahoo's chart API.
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true }
tdw-domain = { workspace = true }
tdw-provider-fileset = { path = "../tdw-provider-fileset" }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
