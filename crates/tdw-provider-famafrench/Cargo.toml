[package]
name = "tdw-provider-famafrench"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): no runnable doc examples; skip the empty doctest harness
# to cut warm `cargo test --workspace` time, matching sibling provider crates.
doctest = false

[features]
default = []
# Enables the real Ken French Data Library HTTP fetcher (reqwest). Off by default
# so workspace tests stay offline; live calls are additionally gated by
# TDW_FAMAFRENCH_LIVE=1. The Data Library is keyless (a public ZIP-of-CSV ftp
# tree). The `zip` dep is pure-Rust (deflate-only -> flate2/miniz_oxide).
http = [
    "dep:async-trait",
    "dep:bytes",
    "dep:reqwest",
    "dep:tokio",
    "dep:zip",
    "tdw-core/http",
]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-core = { workspace = true }
tdw-domain = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
tdw-provider-testkit = { path = "../tdw-provider-testkit" }

[[test]]
name = "http_fetcher"
path = "tests/http_fetcher.rs"
required-features = ["http"]

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["http"]

[lints]
workspace = true
