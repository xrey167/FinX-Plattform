[package]
name = "tdw-llm-anthropic"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
# Enables the real Anthropic Messages API HTTP backend (reqwest).
# Off by default so the workspace test set stays offline; the live
# test is additionally gated by the env vars TDW_ANTHROPIC_LIVE=1
# and ANTHROPIC_API_KEY.
http = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio"]

[dependencies]
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tdw-llm = { workspace = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
