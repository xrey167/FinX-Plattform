[package]
name = "tdw-eval-runner"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[dependencies]
# Raw cron parser for ScheduledEvalConfig::validate() — does NOT pull in
# tdw-cron (which would create a cycle via tdw-worker → tdw-service-api).
cron = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tdw-agent = { path = "../tdw-agent" }
tdw-agent-store = { path = "../tdw-agent-store" }
tdw-core = { workspace = true }
tdw-embed = { path = "../tdw-embed" }
tdw-infer = { path = "../tdw-infer" }
tdw-kg = { path = "../tdw-kg" }
tdw-knowledge = { workspace = true }
tdw-llm = { workspace = true }
tdw-retrieve = { path = "../tdw-retrieve" }
tdw-storage-meilisearch = { path = "../tdw-storage-meilisearch" }
tdw-storage-qdrant = { path = "../tdw-storage-qdrant" }

[features]
# Activates the live local-BERT embedder leg in retrieval-eval integration
# tests. Requires TDW_LOCAL_MODEL_DIR to point at a real model directory.
# Not enabled in CI; enable manually with:
#   cargo test -p tdw-eval-runner --features local-model -- local_model_leg
local-model = ["tdw-embed-local/model"]

[dev-dependencies]
chrono = { workspace = true }
tdw-cron = { path = "../tdw-cron" }
tdw-embed-local = { path = "../tdw-embed-local" }
tdw-llm-anthropic = { workspace = true }
tdw-protocol = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Unique example binary name (the workspace builds examples into one shared
# target dir, where a bare `basic` would collide across crates).
[[example]]
name = "tdw_eval_runner_basic"
path = "examples/basic.rs"

[lints]
workspace = true
