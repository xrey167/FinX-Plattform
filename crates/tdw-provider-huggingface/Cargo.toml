[package]
name = "tdw-provider-huggingface"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[features]
default = []
# Enables the real HuggingFace text-generation HTTP fetcher (reqwest).
# Off by default so workspace tests stay offline; live calls are
# additionally gated by TDW_HUGGINGFACE_LIVE=1 and an HF token env var.
http = ["dep:async-trait", "dep:bytes", "dep:reqwest", "dep:serde_json", "dep:tdw-core", "dep:tokio"]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
