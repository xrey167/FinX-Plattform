[package]
name = "tdw-embed-local"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
# Off by default: the bare crate stays dependency-light (hash provider only).
# `model` pulls in the pure-Rust candle BERT stack for the real local embedder.
default = []
model = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
async-trait = { workspace = true }
tdw-embed = { path = "../tdw-embed" }
# `model`-gated, pure-Rust (no accelerate/cuda/mkl) BERT embedding stack.
# CPU only; default-features = false keeps the candle crates from enabling any
# native math backend, so the crate builds on a Windows host with no C toolchain.
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn = { version = "0.9", default-features = false, optional = true }
candle-transformers = { version = "0.9", default-features = false, optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
serde_json = { workspace = true, optional = true }
# `block_in_place` (used to keep synchronous candle inference off the async poll
# path) needs the multi-thread runtime, which the workspace tokio already enables.
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

# Unique example binary name (the workspace builds examples into one shared
# target dir, where a bare `basic` would collide across crates).
[[example]]
name = "tdw_embed_local_basic"
path = "examples/basic.rs"

[lints]
workspace = true
