[package]
name = "tdw-storage-s3"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
# Enables the real S3 backend (aws-sdk-s3). Off by default so the
# workspace test set stays offline; the integration test is additionally
# gated by env vars TDW_S3_TEST_BUCKET and TDW_S3_TEST_ENDPOINT.
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
# `default-https-client` selects the modern hyper-rustls 0.27 + rustls 0.23 +
# rustls-webpki 0.103 stack via aws-smithy-http-client's `rustls-aws-lc`
# feature. The older `rustls` feature still routes through the legacy
# hyper-rustls 0.24 + rustls 0.21 chain (rustls-webpki 0.101.7), which is
# flagged by GHSA-82j2-j2ch-gfr8 / -xgp8-3hg3-c2mh / -965h-392x-2mh5.
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"], optional = true }
aws-sdk-s3 = { version = "1.134", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"], optional = true }
bytes = { workspace = true }
tdw-core = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
