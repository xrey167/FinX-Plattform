[package]
name = "tdw-session"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real Postgres-backed session store built on top of
# tdw-storage-postgres::PgEngine (in addition to the existing
# SqliteSessionStore which is always available). Off by default so
# the workspace test set stays offline.
postgres = ["dep:tdw-core", "dep:tdw-storage-postgres", "dep:tokio", "tdw-storage-postgres/postgres"]
g013-cross-store = ["postgres", "tdw-bus/postgres", "tdw-outbox/postgres", "tdw-snapshot/postgres"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tdw-core = { workspace = true, optional = true }
tdw-hooks = { path = "../tdw-hooks" }
tdw-protocol = { workspace = true }
tdw-storage-postgres = { path = "../tdw-storage-postgres", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tdw-bus = { path = "../tdw-bus" }
tdw-event = { path = "../tdw-event" }
tdw-outbox = { path = "../tdw-outbox" }
tdw-rollout = { workspace = true }
tdw-snapshot = { path = "../tdw-snapshot" }
tokio = { workspace = true }

# Unique target name so this `examples/basic.rs` does not collide with the other
# persistence crates' `basic` example in the shared workspace target directory.
[[example]]
name = "tdw-session-basic"
path = "examples/basic.rs"

[lints]
workspace = true
