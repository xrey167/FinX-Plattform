[package]
name = "tdw-session"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[features]
default = []
# Enables the real Postgres-backed session store built on top of
# tdw-storage-postgres::PgEngine (in addition to the existing
# SqliteSessionStore which is always available). Off by default so
# the workspace test set stays offline.
postgres = ["dep:tdw-core", "dep:tdw-storage-postgres", "dep:tokio", "tdw-storage-postgres/postgres"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tdw-core = { workspace = true, optional = true }
tdw-hooks = { path = "../tdw-hooks" }
tdw-protocol = { workspace = true }
tdw-storage-postgres = { path = "../tdw-storage-postgres", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
