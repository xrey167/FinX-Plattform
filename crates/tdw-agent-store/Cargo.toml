[package]
name = "tdw-agent-store"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tdw-agent = { path = "../tdw-agent" }
tdw-core = { workspace = true }
# Phase B — RFC3339 age arithmetic + the live consolidation scheduler's wall clock.
chrono = { workspace = true }
# Phase B — the periodic consolidation scheduler task + cooperative shutdown,
# mirroring the `spawn_inmemory_relay` shape in tdw-app-server.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Unique example binary name (the workspace builds examples into one shared
# target dir, where a bare `basic` would collide across crates).
[[example]]
name = "tdw_agent_store_basic"
path = "examples/basic.rs"

[lints]
workspace = true
