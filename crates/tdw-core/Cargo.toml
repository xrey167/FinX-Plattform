[package]
name = "tdw-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
inventory-registration = ["dep:inventory"]
# Shared HTTP fetcher scaffolding (prelude re-export + build_client +
# read_required_key) consumed by `tdw-provider-*` crates. Gated so the default
# offline build pulls in no reqwest dependency.
http = ["dep:reqwest"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
inventory = { version = "0.3.21", optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[example]]
# Unique target name (per-crate) pointing at the standard examples/basic.rs.
# A shared `basic` name across crates collides on one output path under a
# shared target dir; the unique name keeps `examples/basic.rs` collision-free.
name = "tdw_core_basic"
path = "examples/basic.rs"

[lints]
workspace = true
