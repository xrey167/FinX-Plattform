[package]
name = "tdw-storage-meilisearch"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[features]
default = []
# Enables the real Meilisearch HTTP backend (reqwest). Off by default
# so the workspace test set stays offline; the integration test is
# additionally gated by the env var TDW_MEILISEARCH_TEST_URL.
meilisearch = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
