[package]
name = "tdw-provider-http"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the shared generic HTTP fetcher scaffolding (reqwest). Off by default
# so workspace tests stay offline; provider crates turn it on via their own
# `http` feature.
http = [
    "dep:async-trait",
    "dep:bytes",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tdw-core",
    "tdw-core/http",
]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true, optional = true }

[lints]
workspace = true
