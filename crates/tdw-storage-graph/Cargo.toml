[package]
name = "tdw-storage-graph"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Real graph database backend over the Bolt protocol (Memgraph primary;
# Neo4j-compatible by construction). Gated so the default offline build pulls
# in no neo4rs/tokio-network dependency.
bolt = ["dep:neo4rs"]

[dependencies]
async-trait = { workspace = true }
neo4rs = { workspace = true, optional = true }
serde_json = { workspace = true }
tdw-core = { workspace = true }
tdw-tags = { path = "../tdw-tags" }
tdw-taxonomy = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
