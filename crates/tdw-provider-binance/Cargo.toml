[package]
name = "tdw-provider-binance"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real Binance ticker-price HTTP fetcher (reqwest). Off by
# default so workspace tests stay offline; live calls are additionally
# gated by TDW_BINANCE_LIVE=1.
http = ["dep:async-trait", "dep:bytes", "dep:reqwest", "dep:serde_json", "dep:tdw-core", "dep:tokio"]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
