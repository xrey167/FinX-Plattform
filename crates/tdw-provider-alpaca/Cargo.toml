[package]
name = "tdw-provider-alpaca"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real Alpaca stock-bars HTTP fetcher (reqwest). Off by
# default so workspace tests stay offline; live calls are additionally
# gated by TDW_ALPACA_LIVE=1 plus APCA_API_KEY_ID/APCA_API_SECRET_KEY.
http = [
    "dep:async-trait",
    "dep:bytes",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tdw-core",
    "dep:tdw-domain",
    "dep:tokio",
]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true, optional = true }
tdw-domain = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[[example]]
name = "basic"
required-features = ["http"]

[dev-dependencies]
tdw-provider-testkit = { path = "../tdw-provider-testkit" }

[lints]
workspace = true
