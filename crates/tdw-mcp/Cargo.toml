[package]
name = "tdw-mcp"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = []
## Serve live market data: swaps the offline Yahoo fixture for the real HTTP
## fetcher and registers every live HTTP provider in `default_registry()`.
## Off by default so builds and tests stay offline; live calls still honor
## each provider's own gates (API-key env vars where required).
live = ["tdw-service-api/all-http-providers"]

[dependencies]
# The knowledge write tools (B9) stamp proposals with today's UTC date
# (`%Y-%m-%d`), mirroring `tdw-backend`'s knowledge_index convention — tool args
# are attacker-controlled, so the date is taken from the clock, never an arg.
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tdw-agent = { path = "../tdw-agent" }
# B10 — feedback tool stores RetrievalEvent records via RetrievalFeedbackStore.
tdw-agent-store = { path = "../tdw-agent-store" }
tdw-app-client = { workspace = true }
tdw-app-server = { workspace = true }
tdw-config = { workspace = true }
tdw-core = { workspace = true }
# Dynamic per-route MCP tools (L5.6) read the namespaced endpoint catalog at
# runtime to generate one `tdw.route.*` tool per Fetch route; this crate adds NO
# routes — it only reads catalog() to advertise and dispatch them.
tdw-endpoint-catalog = { workspace = true }
tdw-infer = { path = "../tdw-infer" }
tdw-knowledge = { workspace = true }
tdw-protocol = { workspace = true }
tdw-retrieve = { path = "../tdw-retrieve" }
tdw-service-api = { path = "../tdw-service-api" }
tdw-tags = { path = "../tdw-tags" }
tdw-taxonomy = { workspace = true }
tdw-tool-exec = { path = "../tdw-tool-exec" }
# Read-only widget-catalog tools project the OpenBB Workspace widgets.json /
# apps.json contract; the contract test also asserts every widget `mcp_tool.tool_id`
# resolves to a tool in this server's catalog.
tdw-widgets = { workspace = true }
# Used by the ops surface (a tiny current-thread runtime drives the
# graceful-shutdown signal handler) and by the knowledge read tools' sync→async
# bridge; the MCP serve loop itself is plain std.
tokio = { workspace = true, features = ["rt", "signal"] }

[dev-dependencies]
async-trait = { workspace = true }
tdw-app-server = { workspace = true, features = ["transport-http"] }
# Knowledge-tool tests build a KnowledgeRuntime over in-memory engines (hash
# embedder + in-process graph/tags/vector/lexical) and index a few documents.
tdw-embed-local = { path = "../tdw-embed-local" }
tdw-kg = { path = "../tdw-kg" }
tdw-storage-graph = { path = "../tdw-storage-graph" }
tdw-storage-meilisearch = { path = "../tdw-storage-meilisearch" }
tdw-storage-qdrant = { path = "../tdw-storage-qdrant" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[[example]]
name = "tdw_mcp_basic"
path = "examples/basic.rs"

[lints]
workspace = true
