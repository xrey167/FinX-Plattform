[package]
name = "tdw-mcp"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tdw-agent = { path = "../tdw-agent" }
tdw-app-client = { workspace = true }
tdw-app-server = { workspace = true }
tdw-config = { workspace = true }
tdw-protocol = { workspace = true }
tdw-service-api = { path = "../tdw-service-api" }
tdw-tool-exec = { path = "../tdw-tool-exec" }

[dev-dependencies]
tdw-app-server = { workspace = true, features = ["transport-http"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
