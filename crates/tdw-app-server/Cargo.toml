[package]
name = "tdw-app-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# PERF(doctest-disabled): this crate had ZERO runnable doc examples at round_9; the empty
# rustdoc doctest harness is skipped to cut warm `cargo test --workspace` time. WARNING: a
# runnable doc example (```rust / ```no_run / plain ```) added here will be SILENTLY skipped
# until you delete this line. Crates with real doc-tests keep doctests enabled.
doctest = false

[features]
default = ["transport-tcp"]
transport-tcp = []
transport-http = []
transport-uds = []
# Exposes GET /functions, POST /functions/invoke, and PUT /functions/resume
# behind the hand-rolled HTTP transport.  Requires transport-http.
functions-route = ["transport-http", "dep:hmac", "dep:sha2"]
# Exposes the catalog-derived REST surface: GET /api/v1/{route...}?<params>
# and GET /openapi.json behind the hand-rolled HTTP transport. Routes are data,
# resolved through the same policy-guarded fetch path Op::FetchData uses (via a
# RestApiHandler trait seam implemented by tdw-service-api). Requires
# transport-http.
rest-api-route = ["transport-http"]
# Exposes the OpenBB Workspace bridge surface: GET /widgets.json, GET
# /apps.json, and GET /widget-data/{route...}?<params>, with CORS + optional
# X-TDW-API-KEY auth. widgets.json/apps.json are derived from the endpoint
# catalog (via tdw-widgets); widget-data reuses the same policy-guarded fetch
# seam (RestApiHandler) the REST family uses. Requires transport-http.
workspace-route = ["transport-http", "rest-api-route", "dep:tdw-widgets", "dep:subtle"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdw-bus = { path = "../tdw-bus" }
tdw-config = { workspace = true }
tdw-outbox = { path = "../tdw-outbox" }
tdw-protocol = { workspace = true }
tdw-widgets = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

[dev-dependencies]
tdw-event = { path = "../tdw-event" }

# Loom is only compiled under `--cfg loom` and never enters the default build,
# default `cargo test`, or the release profile. See `tests/loom_relay.rs` and
# TEST-POLICY-003 in `docs/quality/test-policy-backlog.md`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[example]]
name = "tdw_app_server_basic"
path = "examples/basic.rs"

[lints]
workspace = true
