[package]
name = "tdw-provider-alpha-vantage"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Enables the real Alpha Vantage HTTP fetcher (reqwest). Off by default so
# workspace tests stay offline; live calls are additionally gated by
# TDW_ALPHA_VANTAGE_LIVE=1 and TDW_ALPHA_VANTAGE_API_KEY.
http = [
    "dep:bytes",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tdw-core",
    "dep:tdw-domain",
    "dep:tokio",
    "tdw-core/http",
    "dep:tdw-provider-http",
    "tdw-provider-http/http",
]

[dependencies]
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tdw-core = { workspace = true, optional = true }
tdw-domain = { workspace = true, optional = true }
tdw-provider-http = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[[example]]
name = "basic"
required-features = ["http"]

[dev-dependencies]
tdw-provider-testkit = { path = "../tdw-provider-testkit" }

[lints]
workspace = true
