name: finx-plattform

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["minimal", "full", "live"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tdw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tdw}
      POSTGRES_DB: ${POSTGRES_DB:-tdw}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdw -d tdw"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.5
    profiles: ["minimal", "full", "live"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tdw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tdw}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      # HTTP ping endpoint available since ClickHouse 20.x; returns "Ok." on 200.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # qdrant/qdrant:v1.14.1 — latest stable 1.x release as of 2025-06; the crate
  # speaks the Qdrant REST API (collections + points) which is stable across 1.x.
  qdrant:
    image: qdrant/qdrant:v1.14.1
    profiles: ["full", "live"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # No in-container healthcheck: the qdrant image is distroless (no shell,
    # curl, or wget), so exec-based probes cannot run. Readiness is checked
    # from outside (CI wait-step curls :6333/healthz from the host).

  # memgraph/memgraph:2.22.1 — pinned stable 2.x; the tdw-storage-graph Bolt
  # backend (knowledge-system A4) speaks plain Bolt v5 + Cypher, stable across
  # 2.x. Neo4j works as a drop-in (same Bolt engine); Memgraph is the primary.
  memgraph:
    image: memgraph/memgraph:2.22.1
    profiles: ["full", "live"]
    ports:
      - "7687:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    # Readiness is checked from outside (Bolt handshake on :7687); the image
    # ships no curl/wget for exec-based probes.

  # getmeili/meilisearch:v1.15.2 — latest stable 1.x release as of 2025-06; the
  # crate talks to the /indexes and /tasks REST API, stable across 1.x.
  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    profiles: ["full", "live"]
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      # /health is the canonical liveness endpoint; returns {"status":"available"}.
      # CI uses the same endpoint (ci.yml "Wait for Meilisearch" step).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # minio/minio:RELEASE.2025-05-24T17-08-30Z — latest stable release tag as of
  # 2025-06; RELEASE.* tags are immutable and the S3-compatible API is stable.
  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    profiles: ["full", "live"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9001:9001"
      - "9002:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      # /minio/health/live is MinIO's canonical liveness probe; CI uses the same
      # endpoint (ci.yml "Wait for MinIO" step uses /minio/health/ready).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # redis-cli ping returns "PONG" when the server is ready.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # minio/mc:RELEASE.2025-05-21T01-59-54Z — pinned to match the minio/minio
  # release above; mc and minio server are versioned in lockstep by MinIO.
  # One-shot init container: no healthcheck (exits after bucket creation).
  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    profiles: ["live"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        attempt=1
        while [ "$$attempt" -le 30 ]; do
          if mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123}; then
            break
          fi
          if [ "$$attempt" -eq 30 ]; then
            echo "minio-init: minio did not become reachable" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        mc mb --ignore-existing local/tdw-default
        echo "minio-init: bucket tdw-default ready"
    restart: "no"

  tdw-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    profiles: ["live"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      qdrant:
        # service_started, not service_healthy: the distroless qdrant image
        # cannot run exec healthchecks (see the qdrant service definition).
        condition: service_started
      meilisearch:
        condition: service_healthy
    environment:
      TDW_POSTGRES_URL: postgres://tdw:tdw@postgres:5432/tdw
      TDW_S3_ENDPOINT: http://minio:9000
      TDW_S3_BUCKET: tdw-default
      TDW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      TDW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      TDW_S3_REGION: us-east-1
      TDW_CLICKHOUSE_URL: http://clickhouse:8123
      TDW_CLICKHOUSE_USER: tdw
      TDW_CLICKHOUSE_PASSWORD: tdw
      TDW_QDRANT_URL: http://qdrant:6333
      TDW_MEILI_URL: http://meilisearch:7700
    restart: "no"

  tdw-worker-serve:
    # Postgres-backed worker: built with --features postgres so PgWorkerQueue
    # is available; self-migrates `system.worker_jobs` on connect.
    image: finx-plattform/tdw-worker:local-pg
    build:
      context: .
      dockerfile: docker/tdw-worker.Dockerfile
      args:
        FEATURES: postgres
    profiles: ["live"]
    command: ["--serve"]
    depends_on:
      postgres:
        condition: service_healthy
      tdw-bootstrap:
        condition: service_completed_successfully
    environment:
      TDW_PROFILE: docker
      TDW_WORKER_PG_URL: postgres://tdw:tdw@postgres:5432/tdw
      TDW_WORKER_ID: tdw-worker-live
      TDW_WORKER_DISPATCH: daemon
      TDW_WORKER_DAEMON_ADDR: tdw-service-daemon:7878
      TDW_WORKER_DAEMON_TIMEOUT_MS: "5000"
      # Drive up to 4 leased jobs in parallel within the serve task.
      TDW_WORKER_CONCURRENCY: "4"
      # Operability surface (/health, /ready, /metrics). Off unless bound; the
      # healthcheck below probes /health.
      TDW_WORKER_HTTP_BIND: 0.0.0.0:9101
    healthcheck:
      # Liveness: the process is serving once /health answers 200. Readiness
      # (/ready) gates on Postgres reachability; liveness is the supervisor probe.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9101/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  tdw-service-daemon:
    # Long-running daemon (no --smoke). Binds 0.0.0.0 so sibling services reach
    # it over the compose network DNS (`tdw-service-daemon:7878`). NOT published
    # to the host: the daemon transport is unauthenticated + plaintext, so it
    # stays internal-only. (To reach it from the host for debugging, attach to
    # the compose network or add a temporary `ports:` override locally.)
    # Built with --features real-engines so the daemon wires the REAL production
    # engines (Postgres relational, ClickHouse OLAP, Qdrant vector, Meilisearch
    # lexical, S3/MinIO blob) AND Postgres-backs its own session/rollout stores
    # (durable across restarts). Engine selection is driven at runtime by
    # TDW_PROFILE=live (fail-closed at startup if a required TDW_* connection env
    # is missing). Distinct image tag from the `full`-profile tdw-service (which
    # builds without features). udf-wasm enables the real wasmi UDF runtime for
    # `udf.run` ToolCalls (per-request WasmLimits); without it the deterministic
    # fixture runtime is used.
    image: finx-plattform/tdw-service:local-pg
    build:
      context: .
      dockerfile: docker/tdw-service.Dockerfile
      args:
        FEATURES: real-engines,udf-wasm
    profiles: ["live"]
    depends_on:
      postgres:
        condition: service_healthy
      tdw-bootstrap:
        condition: service_completed_successfully
    environment:
      # `live` selects the real engines (see TDW_* connection envs below). The
      # daemon fails closed at startup if any required engine env is missing.
      TDW_PROFILE: live
      TDW_DAEMON_TCP_BIND: 0.0.0.0:7878
      # Operability surface (/health, /ready, /metrics) on a separate HTTP
      # listener. Off unless bound; the healthcheck below probes /health.
      TDW_DAEMON_HTTP_BIND: 0.0.0.0:9102
      # Postgres-back the daemon's session + rollout stores in live.
      TDW_DAEMON_PG_URL: postgres://tdw:tdw@postgres:5432/tdw
      # Real-engine connection envs (same backends the bootstrap provisions).
      TDW_POSTGRES_URL: postgres://tdw:tdw@postgres:5432/tdw
      TDW_CLICKHOUSE_URL: http://clickhouse:8123
      TDW_CLICKHOUSE_USER: tdw
      TDW_CLICKHOUSE_PASSWORD: tdw
      TDW_QDRANT_URL: http://qdrant:6333
      TDW_MEILI_URL: http://meilisearch:7700
      TDW_S3_ENDPOINT: http://minio:9000
      TDW_S3_BUCKET: tdw-default
      TDW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      TDW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      TDW_S3_REGION: us-east-1
      # K-E1: pin graph backend to bolt explicitly so the in-memory first-run
      # default never silently propagates to the live stack. TDW_CONFIG_CONTENT
      # is read by load_config() (tdw-backend/src/server/mod.rs) as an InlineEnv
      # layer (precedence 50) merged on top of the base config — see
      # docs/knowledge-quickstart.md §1 for the full layer-order reference.
      # The memgraph service on port 7687 is declared above in the `full`/`live`
      # profiles; `memgraph` resolves via compose-internal DNS.
      TDW_CONFIG_CONTENT: |
        [knowledge.graph]
        backend = "bolt"
        bolt_uri = "bolt://memgraph:7687"
      # Production OIDC ingress auth. Read ONLY when TDW_PROFILE is prod|production
      # (this stack runs `docker`, so they are inert here and left commented).
      # Set all five required vars to attach an auth-backed policy; otherwise the
      # daemon is fail-closed. JWKS is comma-separated kid:alg pairs (RS256/ES256).
      # Validation is STRUCTURAL, not cryptographic. See
      # docs/release/production-auth-oidc.md.
      # TDW_OIDC_ISSUER: https://issuer.example
      # TDW_OIDC_AUDIENCE: tdw-daemon
      # TDW_OIDC_JWKS: key1:RS256,key2:ES256
      # TDW_OIDC_SUBJECT: svc:prod
      # TDW_OIDC_KID: key1
      # TDW_OIDC_ROLES: analyst,udf_runner
    healthcheck:
      # Liveness: daemon serving once /health answers 200. /ready additionally
      # gates on the durable stores being reachable.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9102/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  tdw-mcp-serve:
    # Long-running MCP Streamable HTTP server, daemon-backed tools routed to the
    # tdw-service daemon. Non-loopback bind requires TDW_MCP_HTTP_TOKEN.
    image: finx-plattform/tdw-mcp:local
    build:
      context: .
      dockerfile: docker/tdw-mcp.Dockerfile
    profiles: ["live"]
    command: ["--streamable-http", "0.0.0.0:8788"]
    depends_on:
      # The MCP ops /ready probe checks daemon reachability; do not make
      # `docker compose up -d` fail on a transient daemon health race before
      # the workflow's explicit MCP wait loop can run.
      tdw-service-daemon:
        condition: service_started
    environment:
      TDW_PROFILE: docker
      # Required (no default): a non-loopback MCP bind on a host-published port
      # must be authenticated. `docker compose --profile live up` fails fast if
      # this is unset. Set a strong value in `.env`; front with TLS/OAuth per
      # docs/release/mcp-remote-deployment.md for any non-local exposure.
      TDW_MCP_HTTP_TOKEN: ${TDW_MCP_HTTP_TOKEN:?set TDW_MCP_HTTP_TOKEN (e.g. in .env) before exposing tdw-mcp-serve}
      TDW_MCP_DAEMON_ADDR: tdw-service-daemon:7878
      # Operability surface (/health, /ready, /metrics) on a separate, token-free
      # internal listener. /ready probes daemon reachability. Not host-published.
      TDW_MCP_OPS_BIND: 0.0.0.0:9103
    ports:
      - "8788:8788"
    healthcheck:
      # Liveness on the ops listener (the /mcp surface itself requires a bearer
      # token, so probe the token-free ops /health instead).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9103/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  tdw-service:
    image: finx-plattform/tdw-service:local
    build:
      context: .
      dockerfile: docker/tdw-service.Dockerfile
    profiles: ["full"]
    command: ["--smoke", "AAPL"]
    environment:
      TDW_PROFILE: docker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      qdrant:
        # service_started, not service_healthy: the distroless qdrant image
        # cannot run exec healthchecks (see the qdrant service definition).
        condition: service_started
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  tdw-worker:
    image: finx-plattform/tdw-worker:local
    build:
      context: .
      dockerfile: docker/tdw-worker.Dockerfile
    profiles: ["full"]
    environment:
      TDW_PROFILE: docker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      qdrant:
        # service_started, not service_healthy: the distroless qdrant image
        # cannot run exec healthchecks (see the qdrant service definition).
        condition: service_started
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  tdw-mcp:
    image: finx-plattform/tdw-mcp:local
    build:
      context: .
      dockerfile: docker/tdw-mcp.Dockerfile
    profiles: ["tools"]
    environment:
      TDW_PROFILE: docker
    restart: "no"

  tdw-cli:
    image: finx-plattform/tdw-cli:local
    build:
      context: .
      dockerfile: docker/tdw-cli.Dockerfile
    profiles: ["tools"]
    command: ["AAPL"]
    environment:
      TDW_PROFILE: docker
    restart: "no"

volumes:
  memgraph-data:
  postgres-data:
  clickhouse-data:
  qdrant-data:
  meili-data:
  minio-data:
  redis-data:
