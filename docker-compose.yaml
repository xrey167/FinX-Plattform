name: finx-plattform

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["minimal", "full", "live"]
    environment:
      POSTGRES_USER: tdw
      POSTGRES_PASSWORD: tdw
      POSTGRES_DB: tdw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdw -d tdw"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.5
    profiles: ["minimal", "full", "live"]
    environment:
      CLICKHOUSE_USER: tdw
      CLICKHOUSE_PASSWORD: tdw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["full", "live"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  meilisearch:
    image: getmeili/meilisearch:latest
    profiles: ["full", "live"]
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  minio:
    image: minio/minio:latest
    profiles: ["full", "live"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9001:9001"
      - "9002:9000"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "6379:6379"

  minio-init:
    image: minio/mc:latest
    profiles: ["live"]
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        attempt=1
        while [ "$attempt" -le 30 ]; do
          if mc alias set local http://minio:9000 minio minio123; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo "minio-init: minio did not become reachable" >&2
            exit 1
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        mc mb --ignore-existing local/tdw-default
        echo "minio-init: bucket tdw-default ready"
    restart: "no"

  tdw-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    profiles: ["live"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
      qdrant:
        condition: service_started
      meilisearch:
        condition: service_started
    environment:
      TDW_POSTGRES_URL: postgres://tdw:tdw@postgres:5432/tdw
      TDW_S3_ENDPOINT: http://minio:9000
      TDW_S3_BUCKET: tdw-default
      TDW_S3_ACCESS_KEY: minio
      TDW_S3_SECRET_KEY: minio123
      TDW_S3_REGION: us-east-1
      TDW_CLICKHOUSE_URL: http://clickhouse:8123
      TDW_CLICKHOUSE_USER: tdw
      TDW_CLICKHOUSE_PASSWORD: tdw
      TDW_QDRANT_URL: http://qdrant:6333
      TDW_MEILI_URL: http://meilisearch:7700
    restart: "no"

  tdw-worker-serve:
    # Postgres-backed worker: built with --features postgres so PgWorkerQueue
    # is available; self-migrates `system.worker_jobs` on connect.
    image: finx-plattform/tdw-worker:local-pg
    build:
      context: .
      dockerfile: docker/tdw-worker.Dockerfile
      args:
        FEATURES: postgres
    profiles: ["live"]
    command: ["--serve"]
    depends_on:
      postgres:
        condition: service_healthy
      tdw-bootstrap:
        condition: service_completed_successfully
    environment:
      TDW_PROFILE: docker
      TDW_WORKER_PG_URL: postgres://tdw:tdw@postgres:5432/tdw
      TDW_WORKER_ID: tdw-worker-live
    restart: unless-stopped

  tdw-service-daemon:
    # Long-running daemon (no --smoke). Binds 0.0.0.0 so other services on the
    # compose network can reach it (TDW_DAEMON_TCP_BIND override).
    image: finx-plattform/tdw-service:local
    build:
      context: .
      dockerfile: docker/tdw-service.Dockerfile
    profiles: ["live"]
    depends_on:
      tdw-bootstrap:
        condition: service_completed_successfully
    environment:
      TDW_PROFILE: docker
      TDW_DAEMON_TCP_BIND: 0.0.0.0:7878
    ports:
      - "7878:7878"
    restart: unless-stopped

  tdw-mcp-serve:
    # Long-running MCP Streamable HTTP server, daemon-backed tools routed to the
    # tdw-service daemon. Non-loopback bind requires TDW_MCP_HTTP_TOKEN.
    image: finx-plattform/tdw-mcp:local
    build:
      context: .
      dockerfile: docker/tdw-mcp.Dockerfile
    profiles: ["live"]
    command: ["--streamable-http", "0.0.0.0:8788"]
    depends_on:
      tdw-service-daemon:
        condition: service_started
    environment:
      TDW_PROFILE: docker
      TDW_MCP_HTTP_TOKEN: ${TDW_MCP_HTTP_TOKEN:-local-dev-token}
      TDW_MCP_DAEMON_ADDR: tdw-service-daemon:7878
    ports:
      - "8788:8788"
    restart: unless-stopped

  tdw-service:
    image: finx-plattform/tdw-service:local
    build:
      context: .
      dockerfile: docker/tdw-service.Dockerfile
    profiles: ["full"]
    command: ["--smoke", "AAPL"]
    environment:
      TDW_PROFILE: docker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      qdrant:
        condition: service_started
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: "no"

  tdw-worker:
    image: finx-plattform/tdw-worker:local
    build:
      context: .
      dockerfile: docker/tdw-worker.Dockerfile
    profiles: ["full"]
    environment:
      TDW_PROFILE: docker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      qdrant:
        condition: service_started
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: "no"

  tdw-mcp:
    image: finx-plattform/tdw-mcp:local
    build:
      context: .
      dockerfile: docker/tdw-mcp.Dockerfile
    profiles: ["tools"]
    environment:
      TDW_PROFILE: docker
    restart: "no"

  tdw-cli:
    image: finx-plattform/tdw-cli:local
    build:
      context: .
      dockerfile: docker/tdw-cli.Dockerfile
    profiles: ["tools"]
    command: ["AAPL"]
    environment:
      TDW_PROFILE: docker
    restart: "no"

volumes:
  postgres-data:
  clickhouse-data:
  qdrant-data:
  meili-data:
  minio-data:
