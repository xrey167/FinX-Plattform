name: finx-plattform

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["minimal", "full"]
    environment:
      POSTGRES_USER: tdw
      POSTGRES_PASSWORD: tdw
      POSTGRES_DB: tdw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdw -d tdw"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.5
    profiles: ["minimal", "full"]
    environment:
      CLICKHOUSE_USER: tdw
      CLICKHOUSE_PASSWORD: tdw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  meilisearch:
    image: getmeili/meilisearch:latest
    profiles: ["full"]
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9001:9001"
      - "9002:9000"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "6379:6379"

  tdw-service:
    image: finx-plattform/tdw-service:local
    build:
      context: .
      dockerfile: docker/tdw-service.Dockerfile
    profiles: ["full"]
    command: ["AAPL"]
    environment:
      TDW_PROFILE: docker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      qdrant:
        condition: service_started
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: "no"

  tdw-worker:
    image: finx-plattform/tdw-worker:local
    build:
      context: .
      dockerfile: docker/tdw-worker.Dockerfile
    profiles: ["full"]
    environment:
      TDW_PROFILE: docker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      qdrant:
        condition: service_started
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: "no"

  tdw-mcp:
    image: finx-plattform/tdw-mcp:local
    build:
      context: .
      dockerfile: docker/tdw-mcp.Dockerfile
    profiles: ["tools"]
    environment:
      TDW_PROFILE: docker
    restart: "no"

  tdw-cli:
    image: finx-plattform/tdw-cli:local
    build:
      context: .
      dockerfile: docker/tdw-cli.Dockerfile
    profiles: ["tools"]
    command: ["AAPL"]
    environment:
      TDW_PROFILE: docker
    restart: "no"

volumes:
  postgres-data:
  clickhouse-data:
  qdrant-data:
  meili-data:
  minio-data:
