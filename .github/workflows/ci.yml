name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-default-features

  lint:
    name: Lint, Schema, and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Opt-in UDF runtime features are not in the default matrix; lint + test
      # them here so a dependency or code change cannot silently break the
      # wasmi-backed UDF path (see closed PR #95: a wasmi major bump went green
      # because nothing built these features).
      - run: cargo clippy -p tdw-udf-wasm --features wasmi --all-targets -- -D warnings
      - run: cargo clippy -p tdw-sandbox --features udf-wasm --all-targets -- -D warnings
      - run: cargo clippy -p tdw-service-api --features udf-wasm --all-targets -- -D warnings
      # Postgres-backed daemon session/rollout stores are likewise opt-in: compile
      # the feature here so a change cannot silently break the PG store path
      # (runtime is exercised by the Docker-gated integration tests).
      - run: cargo clippy -p tdw-rollout --features postgres --all-targets -- -D warnings
      - run: cargo clippy -p tdw-service-api --features daemon-postgres --all-targets -- -D warnings
      - run: cargo clippy -p tdw-service --features daemon-postgres --all-targets -- -D warnings
      # The HTTP/SSE transport is opt-in (transport-http) and absent from the
      # default `cargo test --workspace` matrix; lint + test it here so the
      # broadcast fan-out and multi-subscriber path cannot silently break.
      - run: cargo clippy -p tdw-app-server --features transport-http --all-targets -- -D warnings
      # The live HTTP data providers are wired behind per-provider features plus
      # the `all-http-providers` aggregate, absent from the default matrix. Lint
      # + test the aggregate here so a provider or dependency change cannot
      # silently break the wired registry (the default registry stays offline).
      - run: cargo clippy -p tdw-service-api --features all-http-providers --all-targets -- -D warnings
      - run: cargo test -p tdw-udf-wasm --features wasmi
      - run: cargo test -p tdw-sandbox --features udf-wasm
      - run: cargo test -p tdw-app-server --features transport-http
      - run: cargo test -p tdw-service-api --features all-http-providers
      - run: cargo deny check
      - run: cargo run -p xtask -- schema-sync
      - run: git diff --exit-code -- docs/schemas/agent
      - run: cargo run -p xtask -- events schema-check
      - run: git diff --exit-code -- docs/schemas/event
      - run: cargo run -p xtask -- quality-gate check
      - run: cargo run -p xtask -- clean-room-audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  windows-release:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --target x86_64-pc-windows-msvc

  images:
    name: Container Image (${{ matrix.binary }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        binary: [tdw-service, tdw-cli, tdw-mcp, tdw-worker]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.binary }}.Dockerfile
          load: true
          tags: finx-plattform-${{ matrix.binary }}:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finx-plattform-${{ matrix.binary }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/finx-plattform-${{ matrix.binary }}"
          docker tag "finx-plattform-${{ matrix.binary }}:ci" "${image}:sha-${GITHUB_SHA}"
          docker tag "finx-plattform-${{ matrix.binary }}:ci" "${image}:latest"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:latest"

  integration:
    name: Integration, Property, and E2E Subset
    runs-on: ubuntu-latest
    env:
      # `docker compose config` interpolates every service regardless of
      # --profile, and the `live`-profile tdw-mcp-serve requires
      # TDW_MCP_HTTP_TOKEN (no default, by design). This job never starts
      # tdw-mcp-serve or publishes its port, so an ephemeral value here just
      # satisfies interpolation. Operators set a real token via .env.
      TDW_MCP_HTTP_TOKEN: ci-compose-interpolation-only
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: docker compose --profile minimal config
      - run: cargo test --workspace --features integration
      - run: cargo test --workspace --features property
      - run: docker compose --profile full config
      - name: Run G014 dockerized service smoke
        timeout-minutes: 10
        run: docker compose --profile full run --rm --build tdw-service --smoke AAPL
      - name: Run G014 dockerized worker smoke
        timeout-minutes: 10
        run: docker compose --profile full run --rm --build tdw-worker
      - name: Run G014 dockerized worker durable smoke
        timeout-minutes: 10
        run: docker compose --profile full run --rm --build tdw-worker --durable-smoke
      - name: Run G014 dockerized MCP Streamable HTTP smoke
        timeout-minutes: 10
        run: docker compose --profile tools run --rm --build tdw-mcp --streamable-http-smoke
      - run: cargo test --workspace --features e2e
      - run: cargo test -p tdw-tag-rules -p tdw-mask -p tdw-auth -p tdw-auth-oidc

      # --- G010 production storage transports ---
      # Bring up the real backends declared in docker-compose.yaml and run
      # the feature-gated integration tests against them. Each test
      # early-returns when its TDW_*_TEST_* env var is unset, so without
      # these steps the tests are no-ops; with these steps they actually
      # validate the production transport.
      - name: Start G010 storage containers (postgres + minio + clickhouse + qdrant + meilisearch)
        run: docker compose --profile full up -d postgres minio clickhouse qdrant meilisearch

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U tdw -d tdw; then
              exit 0
            fi
            sleep 2
          done
          echo "postgres failed to become ready"; exit 1

      - name: Wait for MinIO and create test bucket
        env:
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9002/minio/health/ready; then
              break
            fi
            sleep 2
          done
          aws --endpoint-url http://127.0.0.1:9002 s3 mb s3://tdw-smoke || true

      - name: Run G010 postgres integration test
        env:
          TDW_POSTGRES_TEST_URL: postgres://tdw:tdw@127.0.0.1:5432/tdw
        run: cargo test -p tdw-storage-postgres --features postgres --test sqlx_engine -- --nocapture

      - name: Run G005 worker postgres queue integration test
        env:
          TDW_POSTGRES_TEST_URL: postgres://tdw:tdw@127.0.0.1:5432/tdw
        run: cargo test -p tdw-worker --features postgres --test pg_worker -- --nocapture

      - name: Run G010 s3 integration test
        env:
          TDW_S3_TEST_BUCKET: tdw-smoke
          TDW_S3_TEST_ENDPOINT: http://127.0.0.1:9002
          TDW_S3_TEST_ACCESS_KEY: minio
          TDW_S3_TEST_SECRET_KEY: minio123
          TDW_S3_TEST_REGION: us-east-1
        run: cargo test -p tdw-storage-s3 --features s3 --test aws_engine -- --nocapture

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/ping; then
              exit 0
            fi
            sleep 2
          done
          echo "clickhouse failed to become ready"; exit 1

      - name: Run G010 clickhouse integration test
        env:
          TDW_CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
          TDW_CLICKHOUSE_TEST_USER: tdw
          TDW_CLICKHOUSE_TEST_PASSWORD: tdw
        run: cargo test -p tdw-storage-clickhouse --features clickhouse --test http_engine -- --nocapture

      # Apply the full tdw migration catalog to the live backends, then exercise
      # the ingest path end-to-end. This catches migration / materialized-view /
      # dictionary regressions that the offline catalog test (which only checks
      # each migration begins with `create`) cannot. The dictionary source
      # placeholders are pointed at the `postgres` compose service (ClickHouse
      # connects to it over the compose network).
      - name: Apply migrations to live postgres + clickhouse
        env:
          PGPASSWORD: tdw
        run: |
          set -euo pipefail
          for f in $(ls migrations/postgres/*.sql | sort); do
            echo "pg: $f"
            docker compose exec -T postgres psql -U tdw -d tdw -v ON_ERROR_STOP=1 -q < "$f"
          done
          docker compose exec -T postgres psql -U tdw -d tdw -q < migrations/postgres/seeds/reference_seed.sql
          for f in $(ls migrations/clickhouse/*.sql | sort); do
            echo "ch: $f"
            sed -e 's/PLACEHOLDER_PG_HOST/postgres/g' \
                -e 's/PLACEHOLDER_PG_DB/tdw/g' \
                -e 's/PLACEHOLDER_PG_USER/tdw/g' \
                -e 's/PLACEHOLDER_PG_PASSWORD/tdw/g' "$f" \
              | docker compose exec -T clickhouse clickhouse-client --user tdw --password tdw --multiquery
          done

      # Drives Op::IngestBatch through the dispatcher against the live ClickHouse
      # (real-clickhouse feature) and asserts the row lands in raw.equity_historical
      # — also exercising the silver-normalization MV + dict_instrument_ref enrichment.
      - name: Run ingest e2e against live ClickHouse (migrations applied)
        env:
          TDW_CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
          TDW_CLICKHOUSE_USER: tdw
          TDW_CLICKHOUSE_PASSWORD: tdw
        run: cargo test -p tdw-service-api --features real-clickhouse --test clickhouse_ingest_e2e -- --nocapture

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:6333/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "qdrant failed to become ready"; exit 1

      - name: Run G010 qdrant integration test
        env:
          TDW_QDRANT_TEST_URL: http://127.0.0.1:6333
        run: cargo test -p tdw-storage-qdrant --features qdrant --test http_engine -- --nocapture

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7700/health; then
              exit 0
            fi
            sleep 2
          done
          echo "meilisearch failed to become ready"; exit 1

      - name: Run G010 meilisearch integration test
        env:
          TDW_MEILISEARCH_TEST_URL: http://127.0.0.1:7700
        run: cargo test -p tdw-storage-meilisearch --features meilisearch --test http_engine -- --nocapture

      - name: Tear down G010 storage containers
        if: always()
        run: docker compose --profile full down -v
