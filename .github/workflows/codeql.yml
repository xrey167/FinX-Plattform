name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 3 * * 1"

# Cancel superseded CodeQL runs on a PR branch when it is pushed again; a
# cancelled Analyze otherwise latches the required "CodeQL" check-context to
# failure on the new head SHA. `main` runs are never cancelled.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: rust
      - uses: github/codeql-action/analyze@v4.37.3
