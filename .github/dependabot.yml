version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # wasmi 0.31 -> 1.0+ is a breaking API rewrite (fuel/StoreLimits/Trap/
      # typed-func surface) that breaks tdw-udf-wasm's wasmi backend. A major
      # bump must be a deliberate, tested migration, not an auto-PR. Allow
      # minor/patch on the 0.31 line. See closed PR #95.
      - dependency-name: "wasmi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # dtolnay/rust-toolchain tags semver-looking refs (1.85.0, 1.99.0, …) as
      # Rust toolchain pinning aliases, not as action releases. Dependabot
      # mis-parses these as new action versions and opens PRs that fail at
      # job-start because the referenced action ref does not exist. Pin the
      # action to a major-version float (or @stable) in workflows and ignore
      # all Dependabot bumps for it. See PRs #4 and #7 for the failure pattern.
      - dependency-name: "dtolnay/rust-toolchain"
