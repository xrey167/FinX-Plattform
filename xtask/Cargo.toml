[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
prost = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
tdw-agent = { path = "../crates/tdw-agent" }
tdw-config = { workspace = true }
tdw-endpoint-catalog = { workspace = true }
tdw-event = { path = "../crates/tdw-event" }
tdw-migration = { path = "../crates/tdw-migration" }
tdw-proto = { path = "../crates/tdw-proto" }
tdw-protocol = { workspace = true }
# Enable every wired HTTP fetcher so `catalog-check` validates catalog
# candidates against the *full* ingest dispatch table, not just the offline
# fixtures. The default build stays offline; this is an xtask-only feature pin.
tdw-service-api = { workspace = true, features = ["all-http-providers"] }
tdw-sql-codegen = { path = "../crates/tdw-sql-codegen" }

[lints]
workspace = true
