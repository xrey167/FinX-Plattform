[workspace]
resolver = "3"
members = [
    "crates/*",
    "xtask",
    # The OpenBB-Workspace example suite (one member crate, many example bins +
    # an integration test). It is a *member* so `cargo metadata` covers it and
    # its CI tests run, but it is kept out of `default-members` below so a plain
    # `cargo build` / `cargo test --workspace` default scope — and warm build
    # time — is unchanged. Build/test it explicitly with
    # `-p tdw-workspace-examples`.
    "examples/workspace",
]
# Default scope for a bare `cargo build` / `cargo test` (no `-p` / `--workspace`):
# everything except the example suite, so the examples never inflate the warm
# build/test the rest of the workspace pays on every invocation. CI runs the
# example tests explicitly via `-p tdw-workspace-examples`.
default-members = [
    "crates/*",
    "xtask",
]
# `fuzz/` is a standalone cargo-fuzz crate (nightly-only, libfuzzer-sys) and is
# intentionally excluded so the stable workspace build and default `cargo test`
# never pull in a nightly toolchain (TEST-POLICY-004). Build it with
# `cargo +nightly fuzz run <target>` from the `fuzz/` directory.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["ReyDa"]
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
# Pure-Rust argument parser (no C/CMake deps). default-features keeps `std` +
# `help`/`usage`/`error-context`/`suggestions`; we build the command tree at
# runtime from the endpoint catalog rather than via the derive macro.
clap = "4.5"
prost = "0.14"
tdw-proto = { path = "crates/tdw-proto" }
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
bytes = "1.11.0"
futures-core = "0.3.31"
schemars = "1.2.1"
ratatui = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Pure-Rust Kafka client (no librdkafka / C / CMake). default-features = false
# drops the compression backends (lz4/zstd/snap pull in C *-sys crates) so it
# builds on a Windows host with no native toolchain; rustls transport only.
rskafka = { version = "0.6.0", default-features = false, features = ["rustls", "transport-tls"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "sqlite-bundled", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3.31", default-features = false }
# Pure-Rust JSON5 parser. Comment-friendly authoring format for the agent registry;
# the MCP wire stays strict JSON via the mcp adapter.
json5 = "1"
# In-memory ZIP reader for the Ken French Data Library research-factor archives
# (tdw-provider-famafrench). `default-features = false` drops every compression
# backend except `deflate`, which selects `flate2` with the pure-Rust
# `miniz_oxide` backend — NO `libz-sys` / system zlib / C toolchain dependency.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Pure-Rust (MIT) XLSX writer for the `tdw-cli --export xlsx` envelope path
# (gap-matrix L5.4 / OpenBB-parity P3W6). Its `default` feature set is empty and
# the required `zip` dep uses the pure-Rust deflate backend, so a bare
# `default-features = false` is already C-free. We deliberately do NOT enable the
# optional `zlib` feature (routes deflate through flate2's C zlib backend) nor
# `polars`/`serde`/`chrono` — NO native / C-binding dependency on Windows CI.
rust_xlsxwriter = { version = "0.95", default-features = false }
# JWT verification (signature + standard claim checks) for the OIDC ingress
# boundary. `rust_crypto` selects the pure-Rust crypto backend (rsa/p256/p384/
# hmac/sha2 crates); no C / CMake / aws-lc-sys build dependency.
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
# Cross-platform filesystem notifications (pure Rust) for event-driven registry hot-reload.
notify = "8"
# Constant-time byte comparison for bearer-token / secret equality checks
# (timing-attack resistant). Already a vetted transitive dependency.
subtle = "2.6"
# HMAC-SHA256 for /functions request-signature verification.
# Both crates are pure Rust (no C/CMake deps) and are already transitively
# present via jsonwebtoken's rust_crypto feature; declaring them here makes
# the version explicit and avoids re-resolving a new entry in Cargo.lock.
hmac = "0.13"
sha2 = "0.11"
# Argon2id password hashing (RustCrypto, pure Rust, MIT OR Apache-2.0).
# No C/CMake deps; compiles cleanly on Windows CI without a native toolchain.
# Stable 0.5.x; 0.6.x is still RC as of 2026-06-07.
argon2 = { version = "0.5", features = ["password-hash", "std"] }
toml = "1.1.2"
tracing = "0.1"
ulid = { version = "1.2.1", features = ["serde"] }
uuid = { version = "1.23.2", features = ["v7", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
wasmi = "0.31"
# Transactional SMTP client. Pure-Rust TLS via rustls (no native-tls / OpenSSL
# build deps) so it compiles on Windows CI without a C toolchain.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "tokio1", "tokio1-rustls-tls", "builder"] }

neo4rs = "0.8"
tdw-symbology = { path = "crates/tdw-symbology" }
tdw-taxonomy = { path = "crates/tdw-taxonomy" }
tdw-config = { path = "crates/tdw-config" }
tdw-acp = { path = "crates/tdw-acp" }
tdw-analytics-technical = { path = "crates/tdw-analytics-technical" }
tdw-analytics-quant = { path = "crates/tdw-analytics-quant" }
tdw-analytics-econometrics = { path = "crates/tdw-analytics-econometrics" }
tdw-analytics-portfolio = { path = "crates/tdw-analytics-portfolio" }
tdw-charting = { path = "crates/tdw-charting" }
tdw-core = { path = "crates/tdw-core" }
tdw-domain = { path = "crates/tdw-domain" }
tdw-endpoint-catalog = { path = "crates/tdw-endpoint-catalog" }
tdw-exec = { path = "crates/tdw-exec" }
tdw-knowledge = { path = "crates/tdw-knowledge" }
tdw-llm = { path = "crates/tdw-llm" }
tdw-llm-anthropic = { path = "crates/tdw-llm-anthropic" }
tdw-llm-openai-compat = { path = "crates/tdw-llm-openai-compat" }
tdw-protocol = { path = "crates/tdw-protocol" }
tdw-rollout = { path = "crates/tdw-rollout" }
tdw-session = { path = "crates/tdw-session" }
tdw-sandbox = { path = "crates/tdw-sandbox" }
tdw-tools = { path = "crates/tdw-tools" }
tdw-tool-exec = { path = "crates/tdw-tool-exec" }
tdw-tui = { path = "crates/tdw-tui" }
tdw-runtime = { path = "crates/tdw-runtime" }
tdw-app-client = { path = "crates/tdw-app-client" }
tdw-app-server = { path = "crates/tdw-app-server" }
tdw-provider-fileset = { path = "crates/tdw-provider-fileset" }
tdw-provider-http = { path = "crates/tdw-provider-http" }
tdw-provider-ws = { path = "crates/tdw-provider-ws" }
tdw-storage-broker = { path = "crates/tdw-storage-broker" }
tdw-storage-fs = { path = "crates/tdw-storage-fs" }
tdw-test-utils = { path = "crates/tdw-test-utils" }
tdw-service-api = { path = "crates/tdw-service-api" }
tdw-widgets = { path = "crates/tdw-widgets" }
tdw-openbb-agent = { path = "crates/tdw-openbb-agent" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
# `--cfg loom` is set manually via RUSTFLAGS for TEST-POLICY-003 loom models
# (see crates/tdw-app-server/tests/loom_relay.rs). Declare it here so the
# `unexpected_cfgs` lint does not warn in the normal (loom-off) build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
